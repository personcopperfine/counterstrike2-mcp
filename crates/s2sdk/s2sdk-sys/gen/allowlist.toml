# s2sdk-sys binding generator allowlist.
#
# What gets generated is exactly what this file lists: gen.py never walks the
# SDK on its own. Growing the bindings = adding a name here (and, for a record
# or interface, adding the matching S2SDK_FORCE_LAYOUT / S2SDK_FORCE_VTABLE row
# to probe.cpp, which gen.py checks against this file), then regenerating.
#
# Per group:
#   headers  SDK headers the group needs. probe.cpp includes exactly these, and
#            every item's declaring header (clang's answer) must be one of them.
#   records  complete types: size, alignment, bases and fields land in the IR.
#   opaque   complete types with a size/alignment but no fields (the emitter
#            emits a byte blob); used for types whose layout the flat IR cannot
#            express, or whose contents are not part of the contract yet.
#   enums    enumerators + underlying type.
#   vtables  classes whose own virtuals land in the IR (Itanium slots).
#   specs    class-template specializations (optional): the flat IR cannot name
#            a template-id, so each one is emitted under a Rust-safe tag
#            (`CUtlVector<CEntityHandle>` -> `CUtlVector_CEntityHandle`) and
#            probe.cpp forces its definition with a S2SDK_FORCE_SPEC row.
#
# Optional per group: `platforms = ["windows"]` marks a group whose classes have no Linux
# build (the tool modules). It is still measured under both ABIs (the header must compile
# under both), but emitted for Windows only and never claimed on Linux; see gen/README.md,
# "Windows-only groups". Absent means both platforms.
#
# Names are as upstream spells them (no `class`/`struct`, no namespaces). A name
# that upstream dropped has to be removed here: gen.py fails the run instead of
# silently emitting less.
#
# [consts] is the one table that is not a type table: it lists the macros /
# constexprs the consumers keep re-spelling by hand, and their values are
# *measured* by clang under both ABIs (see gen/README.md, "the consts kind").
# An entry is either
#   { name = "X", expr = "<C++ expression>", type = "u32" }         measured
#   { name = "X", expr = "<macro>", kind = "string" }               measured
#   { name = "X", derived = "<record>.<member>.<what>", type = "u32" }
# where `derived` reads a number out of clang's record-layout dump (a bitfield
# width, say) instead of evaluating an expression. `per_abi = true` allows the
# two ABIs to disagree; without it a disagreement is a generator error.

# tier0: the small value types every other group embeds or points at.
[tier0]
headers = [
	"tier0/platform.h",
	"appframework/iappsystem.h",
	"tier0/utlstring.h",
	"tier0/utlsymbollarge.h",
	"tier0/buffer_string.h",
	"mathlib/vector.h",
	"color.h",
	"mathlib/vector2d.h",
	"mathlib/vector4d.h",
	"tier0/utlstringtoken.h",
	"tier0/keyvalues3.h",
	"tier0/interface.h",
	"tier0/utlvector.h",
	"tier0/itestscriptmgr.h",
	# CSplitScreenSlot (basetypes.h:579) is a [tier0] value type; the header is
	# listed here and in [entity], whose clients include it first.
	"tier0/basetypes.h",
]
records = [
	"CUtlString",
	"CUtlSymbolLarge",
	"Vector",
	"QAngle",
	"Color",
	"Vector2D",
	"Vector4D",
	"CUtlStringToken",
	"CKV3MemberName",
	# basetypes.h:579 - the split-screen slot index CClientInput's input
	# virtuals take by value (clientinput.h:51ff); one int, `m_Data`.
	"CSplitScreenSlot",
]
# CUtlVector has no data members of its own: `CUtlVectorBase` holds `m_Size`
# and the allocator subobject, so only the specialization has a layout to
# check. The bridge reads the entity list through it (`m_Size` at 0 and
# `m_Memory.m_pMemory` at 8).
specs = ["CUtlVector<CEntityHandle>"]
# CBufferString has an anonymous union member, which the flat IR (one field
# list, no nesting) cannot express; its size/alignment are all a caller needs.
opaque = ["CBufferString"]
enums = []
# IBaseInterface is the primary base of IGameEventManager2 (and of every other
# interface the bridge names), so it has to be in the IR: a VClass static names
# its base by reference.
vtables = ["IAppSystem", "IBaseInterface", "ITestScriptMgr"]

# schema: the loader / introspector the safe layer talks to.
[schema]
headers = [
	"schemasystem/minschema.h",
	"schemasystem/baseschema.h",
	"schemalib/schematype.h",
	"schemalib/schemaclassinfo_data.h",
	"schemalib/schemametadata_data.h",
	"schemasystem/ischemasystem.h",
	"schemasystem/schemasystem.h",
	"schemalib/schemaclassinfo.h",
]
records = [
	"CSchemaType",
	"SchemaClassInfoData_t",
	"SchemaClassFieldData_t",
	"SchemaStaticFieldData_t",
	"SchemaMetadataEntryData_t",
	"SchemaBaseClassInfoData_t",
	# The empty derived class ISchemaSystem hands out; it exists so
	# `SchemaMetaInfoHandle_t<CSchemaClassInfo>` can name a type that is in the
	# IR (the handle is a one-pointer wrapper around it).
	"CSchemaClassInfo",
]
opaque = []
# "type-category enums": the tags CSchemaType carries, the scope selector and
# the builtin-type tag SchemaMetaInfoHandle_t<CSchemaType_Builtin> returns.
enums = [
	"SchemaTypeCategory_t",
	"SchemaAtomicCategory_t",
	"SchemaTypeScope_t",
	"SchemaBuiltinType_t",
]
# CSchemaSystemTypeScope adds no virtual of its own (its vtable is
# ISchemaSystemTypeScope's); it is listed so the binding covers the class
# ISchemaSystem returns, and the other two so the vtable is actually described.
vtables = ["ISchemaSystem", "ISchemaSystemTypeScope", "CSchemaSystemTypeScope"]

# entity: the handles/identities a plugin gets from game events and the schema.
[entity]
headers = [
	"tier0/basetypes.h",
	"entityhandle.h",
	"entity2/entityidentity.h",
	"entity2/entityinstance.h",
]
records = ["CEntityIdentity", "CEntityIndex", "CEntityInstance"]
# CEntityHandle is `class CEntityHandle { union { uint32 m_Index; struct {
# uint32 m_EntityIndex : 15; uint32 m_Serial : 17; } m_Parts; }; }`: the only
# member is anonymous, so there is no field name to emit and no way to measure
# the unnamed union's size from C++ (the compiler, not the standard, owns the
# anonymous-member rule). Size/alignment are exact; the bit view is not - the
# `[consts]` ENTITY_INDEX_BITS/ENTITY_SERIAL_BITS read the widths out of clang's
# layout dump instead.
opaque = ["CEntityHandle"]
enums = []
# CEntityInstance is listed as a record too: the bridge reads its members
# (`m_pEntity` at 0x10), not only its vtable.
vtables = ["CEntityInstance"]

# cvar: read/observe convars through the engine's own ICvar.
[cvar]
headers = ["tier0/convar.h", "tier0/icvar.h"]
records = ["ConVarData", "CVValue_t", "ConVarRef", "ConVarRefAbstract"]
opaque = []
enums = ["EConVarType"]
vtables = ["ICvar"]

# events: the game-event listener a plugin registers with the engine.
[events]
headers = ["igameevents.h"]
records = []
opaque = []
enums = []
vtables = ["IGameEvent", "IGameEventListener2", "IGameEventManager2"]

# engine: the server-side interface and the render types the bridge takes by
# value. ISource2ServerConfig is the one engine interface whose vtable upstream
# declares in full (11 IAppSystem slots + 18 of its own = the 29 the bridge
# asserts as SRVCFG_VT_SLOTS); RenderViewport_t is the viewport S2Viewport
# mirrors field for field. The engine services and the client's engine interface
# are here too: IEngineService is the base of IRenderService / IInputService (the
# render and input services the bridge calls through), ISource2Engine the base of
# IVEngineClient2, and EngineClientUnk40_t the placeholder IVEngineClient2 returns
# by value. All of them exist in the Linux libengine2.so as well.
[engine]
headers = [
	"engine2/isource2serverconfig.h",
	"playerslot.h",
	"rendersystem/rendersystemtypes.h",
	"engine2/iengineservicemgr.h",
	"engine2/irenderservice.h",
	"engine2/iinputservice.h",
	"engine2/isource2engine.h",
	"engine2/ivengineclient2.h",
	"engine2/isource2server.h",
]
records = ["CPlayerSlot", "RenderViewport_t", "EngineClientUnk40_t", "IInputHandler", "IKeybindChangeListener"]
opaque = []
enums = []
vtables = ["ISource2ServerConfig", "IEngineService", "IRenderService", "IInputService", "IInputHandler", "IKeybindChangeListener", "ISource2Engine", "IVEngineClient2", "ISource2Server"]

# toolframework2: the Workshop Tools host and the interface of a tool module. The module
# has no Linux build, so the group is Windows-only: measured under both ABIs (the header
# has to compile under both), emitted and claimed for MSVC only.
[toolframework2]
platforms = ["windows"]
headers = ["toolframework2/itoolframework2.h"]
records = ["ToolActivationRequest_t", "ToolOpenAssetEntry_t", "MultiAxisControllerInput_t"]
opaque = []
enums = []
vtables = ["IToolFramework2", "IToolSystem2", "IToolFrameListener"]

# rendersystem: the render device the bridge reads textures back through. HRenderTexture is the
# weak texture handle the scene system and the device share; ImageFormat is the engine's pixel
# format enum (the bridge's four format values are ImageFormat constants); CStrongHandle<...> is
# the reference-holding texture handle four IRenderDevice slots return by value, and the placeholder
# the four floats GetTextureAverageColorRGBA returns. Both ABIs: librendersystemvulkan
# exists on Linux.
[rendersystem]
headers = [
	"bitmap/imageformat_declarations.h",
	"rendersystem/rendersystemtypes.h",
	"rendersystem/irenderdevice.h",
]
records = ["HRenderTexture", "RenderDeviceUnkVector4_t"]
specs = ["CStrongHandle<InfoForResourceTypeCTextureBase>"]
opaque = []
enums = ["ImageFormat"]
vtables = ["IRenderDevice"]

# scenesystem: the scene system the renderer drives: the views a bridge adds, the layers and
# pipelines it queues. CFrustum is the camera the views are built from (sizeof 0x420, the
# bridge copies it whole); CViewId, the render handles and the two placeholders are the
# by-value types the interfaces take and return. Both ABIs: libscenesystem exists on Linux.
[scenesystem]
headers = [
	"mathlib/camera.h",
	"scenesystem/iscenesystem.h",
	"scenesystem/isceneutils.h",
]
records = [
	"Camera_t",
	"CFrustum",
	"CViewId",
	"CRenderAttributes",
	"HMaterialWeak",
	"SceneViewUnk16_t",
	"SceneViewUnk4_t",
]
opaque = []
enums = []
vtables = ["ISceneSystem", "ISceneView", "IRenderingPipeline", "ISceneUtils"]

# soundsystem: the sound operator system the engine plays and queries sound events through.
# ISoundOpSystem is also the interface the bridge wraps (the start-event hooks and the
# listener); SosStartSoundEventParams_t is the by-pointer params block those hooks read.
# Both ABIs: libsoundsystem exists on Linux.
[soundsystem]
headers = ["soundsystem/isoundopsystem.h"]
records = ["SoundEventGuid_t", "SoundGuid_t", "SosStartSoundEventParams_t"]
opaque = []
enums = []
vtables = ["ISoundEventListener", "ISoundEventManager", "ISoundOpSystem"]

# particles: the particle system manager and the registered particle function classes the particle
# editor lists (its operator picker walks IParticleSystemMgr's function definitions by type).
# HParticleSystemDefinition / HParticleSnapshot are the weak resource handles the manager hands
# out, and ParticleSnapshotAttributeMap_t the element of the vector InitSnapshot takes.
# EAttributeDataType is the attribute data type the manager reports (CS2 has a fifth type at 4).
# Both ABIs: libparticles exists on Linux.
[particles]
headers = ["tier0/utlsoacontainer.h", "particles/iparticlesystemmgr.h"]
records = ["HParticleSystemDefinition", "HParticleSnapshot", "ParticleSnapshotAttributeMap_t"]
opaque = []
enums = ["ParticleOperatorId_t", "EAttributeDataType"]
vtables = ["IParticleSystemMgr", "IParticleFunctionDefinition"]

# client: the client's input object (the bridge hooks three of its virtuals and walks its button table).
# CCSGOInput derives CClientInput and the engine2 input callback interfaces IKeybindChangeListener and
# IInputHandler (declared in engine2/iinputservice.h, listed in [engine]). Both ABIs: libclient exists on
# Linux. The headers live under game/client, which the consumer puts on its include path (gen.py).
[client]
headers = ["clientinput.h", "cstrike15/cs_clientinput.h"]
records = ["CInputValueBase", "ClientInputButton_t", "CClientInput", "CCSGOInput"]
opaque = []
enums = []
vtables = ["CClientInput", "CCSGOInput"]

# toolutils2: the base classes of the Workshop Tools editors (pet, modeldoc_editor and hammer link the same
# code): the bind target interface, the editor app and session bases, the undo history and the attribute
# table interfaces. Windows-only like the tool modules; no Itanium number is a claim about any binary.
[toolutils2]
platforms = ["windows"]
headers = [
	"toolutils2/ibindtarget.h",
	"toolutils2/itoolsresourcelistener.h",
	"toolutils2/undohistory.h",
	"toolutils2/toolattr.h",
	"toolutils2/baseeditorsession.h",
	"toolutils2/baseeditorapp.h",
	"toolutils2/toolnodetypename.h",
	"toolutils2/itoolrenderableviewhost.h",
	"toolutils2/ibindablecamerascene.h",
]
records = [
	"IBindTarget",
	"IToolsResourceListener",
	"IUndoable",
	"IUndoListener",
	"CBaseUndoable",
	"UndoGroup_t",
	"CUndoHistory",
	"ToolAttrUnk_t",
	"IToolAttr_Table",
	"IToolAttrNotifyRoot",
	"CBaseKV3DataWithFGDClass",
	"CBaseEditorSession",
	"CSimpleBaseEditorSession",
	"CSimpleSharedWindowEditorSession",
	"CBaseEditorApp",
	"CBaseEditorSharedWindowApp",
	"CBaseEditorSeparateWindowApp",
	"CToolNodeTypeName",
	"ToolCameraUnk_t",
	"ToolRenderableViewHostUnk8_t",
	"IToolRenderableViewHost",
	"IBindableCameraScene",
]
# CBaseToolSystem2 derives the polymorphic template chain CTier3AppSystem<IToolSystem2>, which the flat IR
# cannot spell (a specialization with a vtable pointer); its only member, the tool index, is not pinned.
opaque = ["CBaseToolSystem2"]
enums = []
vtables = [
	"IBindTarget",
	"IToolsResourceListener",
	"IUndoable",
	"IUndoListener",
	"CBaseUndoable",
	"CUndoHistory",
	"IToolAttr_Table",
	"IToolAttrNotifyRoot",
	"CBaseKV3DataWithFGDClass",
	"CBaseEditorSession",
	"CBaseEditorApp",
	"CBaseEditorSharedWindowApp",
	"IToolRenderableViewHost",
	"IBindableCameraScene",
]

# pet: the particle editor's document, session and application, on top of toolutils2. Windows-only (pet.dll).
# The Qt widgets (CQPetMainWnd and the rest) are forward declarations: the SDK has no Qt.
[pet]
platforms = ["windows"]
headers = ["petdoc_lib/petdoc.h", "pet/petapp.h"]
records = ["CBasePetNode", "PetDocSelection_t", "CPetDoc", "CPetSession"]
# CPetApp derives CSimpleEditorSharedWindowApp<CPetSession, CQPetMainWnd>, a polymorphic class template the
# flat IR cannot spell; its own members are not known and its main window pointer is tied through the size of
# CBaseEditorSharedWindowApp (the template's only member follows it).
opaque = ["CPetApp"]
enums = []
vtables = ["CBasePetNode", "CPetDoc", "CPetSession"]

# datamodel: the datamodel the Workshop Tools editors keep their documents in: the interface, the element base class
# and the attribute (the element handles and the attribute handle are the enums the interface takes by value).
# Windows-only like the tool modules (hammer.dll links it; the group is measured under both ABIs, claimed for MSVC).
# CDmAttribute has no virtual; DmAttributeType_t is declared opaque upstream, so it is not listed.
[datamodel]
platforms = ["windows"]
headers = [
	"datamodel/dmelementhandle.h",
	"datamodel/dmattributetypes.h",
	"datamodel/idatamodel.h",
	"datamodel/dmelement.h",
	"datamodel/dmattribute.h",
]
records = ["DmAttributeList_t", "DmElementReference_t", "CDmElement", "CDmAttribute"]
# IDataModel derives CBaseAppSystem<IAppSystem>, a polymorphic class template the flat IR cannot spell; it has
# no data member, so its vtable is all that is claimed.
opaque = ["IDataModel"]
enums = ["DmElementHandle_t", "DmAttributeHandle_t", "DmFileId_t"]
vtables = ["IDataModel", "CDmElement"]

# mapdoclib: the Hammer map document: the node classes (atom, point, node, entity, mesh), the node interfaces,
# the document with its root element, undo history and edit scopes. Windows-only (hammer.dll). The polygon mesh
# inside CMapMeshBase, the FGD class of an entity and the selection are not declared; the document, the nodes and
# the root element are the classes the bridge reads and calls.
[mapdoclib]
platforms = ["windows"]
headers = [
	"mapdoclib/mapnode.h",
	"mapdoclib/mapentity.h",
	"mapdoclib/mapmesh.h",
	"mapdoclib/mapdoc.h",
]
records = [
	"MapNodeUnk8_t",
	"MapNodeUnk4_t",
	"IToolRenderCallbacks",
	"IHitTestable",
	"ITransformable",
	"IMapNodeToolAttrRoot",
	"IRaytraceEnvironmentOwner",
	"CMapAtom",
	"CMapPoint",
	"CMapNode",
	"MapEntityConnection_t",
	"FgdClass_t",
	"IVDataLookupListener",
	"CMapEntityIONode",
	"CMapGameDataNode",
	"CMapEntity",
	"IHammerMeshChangeListener",
	"CMapMeshBase",
	"CMapMesh",
	"IMapFileReference",
	"IUndoDoc",
	"CMapDocHistory",
	"CMapRootElement",
	"CEditScopeStack",
	"CMapDoc",
]
opaque = []
enums = []
vtables = [
	"IToolRenderCallbacks",
	"IHitTestable",
	"ITransformable",
	"IMapNodeToolAttrRoot",
	"IRaytraceEnvironmentOwner",
	"CMapAtom",
	"CMapPoint",
	"CMapNode",
	"IVDataLookupListener",
	"CMapEntityIONode",
	"CMapGameDataNode",
	"IHammerMeshChangeListener",
	"CMapMeshBase",
	"CMapMesh",
	"CMapEntity",
	"IMapFileReference",
	"IUndoDoc",
]

# hammer: the Hammer editor application's session, the session of its map document and the viewports. Windows-only
# (hammer.dll). The application object itself is not declared: its pins are the shared editor base's (toolutils2).
[hammer]
platforms = ["windows"]
headers = [
	"hammer/hammereditorsession.h",
	"hammer/mapview.h",
	"hammer/mapviewmgr.h",
]
records = [
	"HammerEditorSettings_t",
	"IBindableCommandListener",
	"IAssetFileListener",
	"IMapDocSession",
	"CMapDocSession",
	"CHammerEditorSession",
	"CMapView",
	"ITagVisualizationListener",
	"IShaderReloadListener",
	"IBoundingBoxChangeListener",
	"CMapViewMgr",
]
opaque = []
enums = []
vtables = [
	"IBindableCommandListener",
	"IAssetFileListener",
	"IMapDocSession",
	"CMapDocSession",
	"CHammerEditorSession",
	"ITagVisualizationListener",
	"IShaderReloadListener",
	"IBoundingBoxChangeListener",
]

# modeldoc_editor: the model editor's application and document session, on top of toolutils2. Windows-only
# (modeldoc_editor.dll). The Qt main window and the document are forward declarations. The session and the
# app declare no virtual of their own: their tables are CBaseEditorSession's and CBaseEditorApp's, so only
# IAssetFingerprintListener names a method.
[modeldoc_editor]
platforms = ["windows"]
headers = ["tier0/errorlistener.h", "modeldoc_editor/modeldoc_editor_app.h"]
records = ["IAssetFingerprintListener", "IErrorListener", "CModelDocAnalysis", "CModelDocEditorSession", "CModelDocEditorApp"]
opaque = []
enums = []
vtables = ["IAssetFingerprintListener", "IErrorListener"]

# metamod: the *second* upstream - Metamod:Source 2.0-dev (crates/metamod/upstream,
# pinned by METAMOD.lock) and its third_party/khook submodule, not crates/s2sdk/
# upstream. The classes are the plugin-facing interfaces a Metamod plugin calls
# through: the plugin callbacks the game calls (ISmmPlugin), the event listener
# (IMetamodListener, declared in ISmmPlugin.h), the core API it is handed
# (ISmmAPI) and KHook's detour interface (IKHook, in namespace KHook).
#
# Two things this group needs from the run rather than from the headers:
#   * META_NO_HL2SDK + META_IS_SOURCE2 (ISmmAPI.h:40-61) skip the hl2sdk includes
#     (`interfaces/interfaces.h`, `tier1/interface.h`, `convar.h`, `eiface.h`),
#     which this repository does not have - but ISmmAPI.h:68-70 still constructs a
#     `CPlayerSlot` (`MMSPlayer_t`), so `playerslot.h` is listed first: it is an
#     s2sdk header (the class only exists there), included before ISmmAPI.h.
#   * the metamod include dirs come before the s2sdk ones (gen.py,
#     `metamod_first_includes`), and khook.hpp is reached through KHook's own
#     `include/` (metamod's ISmmPlugin.h includes it bare).
# `khook.hpp` is listed because IKHook is declared there; KHook spells its own
# types qualified in a signature (`KHook::Action`, `std::size_t`), which gen.py
# resolves by the bare name (see `TypeMapper.resolve_known`).
[metamod]
headers = [
	"playerslot.h",
	"core/ISmmAPI.h",
	"core/IPluginManager.h",
	"core/ISmmPlugin.h",
	"khook.hpp",
]
records = [
	"ISmmPlugin",
	"IMetamodListener",
	"ISmmAPI",
	"ISmmPluginManager",
	"IKHook",
]
opaque = []
enums = ["Pl_Status"]
vtables = [
	"ISmmPlugin",
	"IMetamodListener",
	"ISmmAPI",
	"ISmmPluginManager",
	"IKHook",
]

# consts: the numbers and version strings a consumer would otherwise spell out
# by hand. Every value here is produced by clang - the macro is expanded and
# evaluated under both ABIs - never entered into this file. `headers` lists what
# the expressions need, from either upstream (probe.cpp includes them in this
# order; `core/ISmmPluginExt.h` is metamod's). A value measured from the second
# upstream must also be listed in gen.py's C_HEADER_EXCLUDED_CONSTS: the frozen C
# bridge cannot name it, so bridge/s2sdk_gen.h must not carry it.
[consts]
headers = [
	"const.h",
	"tier0/generichash.h",
	"tier0/utlvectormemory.h",
	"appframework/iappsystem.h",
	"interfaces/interfaces.h",
	"bitmap/imageformat_declarations.h",
	"core/ISmmPluginExt.h",
	"tier0/convar.h",
]
# `type` is the Rust spelling the value is emitted with (the width the C++
# macro has: `MAX_EDICTS` is an `int`, but it is an entity count, so u32); the
# generator checks the measured value fits it.
entries = [
	{ name = "MAX_EDICTS", expr = "MAX_EDICTS", type = "u32", doc = "public/const.h `MAX_EDICTS`: 1<<MAX_EDICT_BITS, the engine's entity count." },
	{ name = "NUM_ENT_ENTRY_BITS", expr = "NUM_ENT_ENTRY_BITS", type = "u32", doc = "public/const.h: bits an ehandle index is encoded in." },
	{ name = "NUM_ENT_ENTRIES", expr = "NUM_ENT_ENTRIES", type = "u32", doc = "public/const.h: 1<<NUM_ENT_ENTRY_BITS. NOT the identity index bound the client uses - see ENTITY_INDEX_BITS." },
	{ name = "NUM_SERIAL_NUM_BITS", expr = "NUM_SERIAL_NUM_BITS", type = "u32", doc = "public/const.h: ehandle serial-number bits." },
	{ name = "MAX_ENTITIES_IN_LIST", expr = "MAX_ENTITIES_IN_LIST", type = "u32", doc = "public/entity2/entityidentity.h: CEntityIdentity entries per identity chunk (512 = 1<<9). The bridge's client identity lookup splits an entity index at this boundary (chunk = index / 512, slot = index % 512)." },
	{ name = "INVALID_EHANDLE_INDEX", expr = "INVALID_EHANDLE_INDEX", type = "u32", doc = "public/const.h: the all-ones ehandle index." },
	{ name = "EXTERNAL_CONST_BUFFER_MARKER", expr = "CUtlVectorMemory_Growable<int>::EXTERNAL_CONST_BUFFER_MARKER", type = "u32", doc = "tier0/utlvectormemory.h: CUtlVector uses a const external buffer (never realloc, never free)." },
	{ name = "EXTERNAL_BUFFER_MARKER", expr = "(uint32)CUtlVectorMemory_Growable<int>::EXTERNAL_BUFFER_MARKER", type = "u32", doc = "tier0/utlvectormemory.h: CUtlVector uses an external buffer it may reallocate. The enum is `int`, so 1<<31 is a negative int there and the entry reads it as the uint32 bit pattern 0x80000000 that the bridge's mask wants. The bridge's S2_UTLVEC_EXTERNAL comment names this marker for the 1<<30 value." },
	{ name = "STRINGTOKEN_MURMURHASH_SEED", expr = "STRINGTOKEN_MURMURHASH_SEED", type = "u32", doc = "tier0/utlstringtoken.h: the seed every CUtlStringToken hash uses." },

	# The interface versions the bridge asks CreateInterface for. Upstream spells
	# them all in public/interfaces/interfaces.h (SCHEMASYSTEM_INTERFACE_VERSION
	# also in schemasystem/ischemasystem.h). `ToolSystem2_001` has no upstream
	# macro and stays bridge-owned.
