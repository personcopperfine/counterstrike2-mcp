# Expectations taken from the work package's acceptance list. gen.py verifies
# these on every run so an upstream bump that silently moves a field shows up
# as a failed run instead of a wrong binding. Keys are
# "<group>.<record>.<field>" for a field offset, "<group>.<record>" for a
# record ({"size","align"}), "<group>.<vtable>.<method>" for a slot,
# "<group>.<vtable>" for a vtable length ({"length" = the Itanium one,
# "msvc_length" = the Windows one clang's vftable pass printed) and
# "<group>.<const>" for a `[consts]` value (whose `value` may be a number or a
# string).
#
# Both ABIs are checkable: "size"/"align"/"offset"/"bit_offset"/"bit_width" and
# "itanium_slot" are the top-level (Itanium) numbers, their "msvc_*" twins come
# from the "msvc" sub-object and the "msvc_slot" key. "<method>#k" addresses the
# k-th declaration of an overloaded name in declaration order, the way
# abi::slot does; a plain name means "#0" (the first declaration). "length" is
# the Itanium vtable length the way abi::vtable_len computes it (a destructor
# counts two entries there) and "msvc_length" the length clang's Windows vftable
# pass printed; both are numbers a consumer pins, so an upstream bump that adds a
# virtual fails this run instead of being regenerated into the IR. A method key
# may also carry "last_slot = true": the method's slot is that vtable's last entry
# on both ABIs (gen.py `_check_last_slot`; the generated tests assert both kinds,
# gen.py `checks_pinned_vtable_test`).
[checks]
"schema.SchemaClassFieldData_t" = { size = 32, align = 8, msvc_size = 32, msvc_align = 8 }
"schema.SchemaClassFieldData_t.m_pName" = { offset = 0, size = 8, msvc_offset = 0 }
"schema.SchemaClassFieldData_t.m_pType" = { offset = 8, msvc_offset = 8 }
"schema.SchemaClassFieldData_t.m_nSingleInheritanceOffset" = { offset = 16, msvc_offset = 16 }
"schema.ISchemaSystem.FindTypeScopeForModule" = { itanium_slot = 13, msvc_slot = 13, decl_index = 2 }
# The bridge pins FindRawClassBinding at slot 25 (Itanium: 24): upstream declares
# the `const char *` overload first and MSVC packs an overload group in reverse,
# so "#0" is one entry later there. The #1 check is the other half of the swap,
# and CEntityInstance's const overload adds the one-slot-destructor shift
# (Itanium 40 -> MSVC 38) on top of it.
"schema.ISchemaSystemTypeScope.FindRawClassBinding#0" = { itanium_slot = 24, msvc_slot = 25 }
"schema.ISchemaSystemTypeScope.FindRawClassBinding#1" = { itanium_slot = 25, msvc_slot = 24 }
"entity.CEntityInstance.GetChangeAccessorPathInfo#1" = { itanium_slot = 40, msvc_slot = 38 }
"tier0.Vector" = { size = 12, align = 4, msvc_size = 12, msvc_align = 4 }
"entity.CEntityIdentity" = { size = 112, align = 8, msvc_size = 112, msvc_align = 8 }
# CEntityHandle is one uint32 (the unsigned union of m_Index and the two
# bitfields), so 4 bytes on both ABIs; the bridge passes it by value.
"entity.CEntityHandle" = { size = 4, align = 4, msvc_size = 4, msvc_align = 4 }
"cvar.CVValue_t" = { size = 16, align = 8, msvc_size = 16, msvc_align = 8 }

