# --------------------------------------------------------------------------- #
# metamod: the second upstream (Metamod:Source 2.0-dev + KHook). Every number
# here is the compiler's, read off ir/metamod.json after the first generation and
# then pinned: a metamod or khook bump that adds, removes or reorders a virtual
# fails the run (and `gen.py --check`) instead of being regenerated silently.
# --------------------------------------------------------------------------- #
# ISmmPlugin declares a virtual destructor (ISmmPlugin.h:76,84) right after
# GetApiVersion: two Itanium entries, one MSVC one, so every later Itanium
# slot is MSVC + 1 and the whole table is one entry longer there. The generated
# tests assert both numbers and that relation.
"metamod.ISmmPlugin" = { size = 8, align = 8, msvc_size = 8, msvc_align = 8, length = 17, msvc_length = 16 }
"metamod.ISmmPlugin.GetApiVersion" = { itanium_slot = 0, msvc_slot = 0, decl_index = 0 }
"metamod.ISmmPlugin.Load" = { itanium_slot = 3, msvc_slot = 2, decl_index = 2 }
# IMetamodListener (ISmmPlugin.h:211) declares no destructor: 15 slots on both.
"metamod.IMetamodListener" = { size = 8, align = 8, msvc_size = 8, msvc_align = 8, length = 15, msvc_length = 15 }
"metamod.IMetamodListener.OnPluginLoad" = { itanium_slot = 0, msvc_slot = 0, decl_index = 0 }
# ISmmAPI (ISmmAPI.h:88) declares no destructor either; GetDetourInterface
# (ISmmAPI.h:449) is its
# last virtual, which is the slot a hook-plugin's PLUGIN_SAVEVARS() calls.
"metamod.ISmmAPI" = { size = 8, align = 8, msvc_size = 8, msvc_align = 8, length = 34, msvc_length = 34 }
"metamod.ISmmAPI.GetDetourInterface" = { itanium_slot = 33, msvc_slot = 33, decl_index = 33, last_slot = true }
# ISmmPluginManager (IPluginManager.h:66, MetaFactory MMIFACE_PLMANAGER): 8 pure
# virtuals, no destructor, no overloads, so the same slots on both ABIs. The
# bridge's `metamod.plugins` walks the plugin table through Query (and the
# QueryHandle after it), so both are pinned with the length.
"metamod.ISmmPluginManager" = { size = 8, align = 8, msvc_size = 8, msvc_align = 8, length = 8, msvc_length = 8 }
"metamod.ISmmPluginManager.Query" = { itanium_slot = 5, msvc_slot = 5, decl_index = 5 }
"metamod.ISmmPluginManager.QueryHandle" = { itanium_slot = 7, msvc_slot = 7, decl_index = 7, last_slot = true }
"consts.MMIFACE_PLMANAGER" = { value = "IPluginManager" }
# IKHook (khook.hpp:2184): 15 pure virtuals, no destructor, same slots on both
# ABIs - every one of them is pinned, because KHook is a submodule of the second
# upstream that can move under this repository: a reordered or added virtual has
# to fail the run, not silently renumber what a plugin calls through.
"metamod.IKHook" = { size = 8, align = 8, msvc_size = 8, msvc_align = 8, length = 15, msvc_length = 15 }
"metamod.IKHook.SetupHook" = { itanium_slot = 0, msvc_slot = 0, decl_index = 0 }
