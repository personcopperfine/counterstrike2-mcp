# The AGENTS.md checks a runner can do (no game binaries here: sdkcheck, `sigcheck resolve
# --strict` and the pins gate stay with the maintainer, RELEASING.md).
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  XWIN_VERSION: "0.10.0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: clippy + test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-linux
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  win64:
    name: check + clippy (win64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c clippy --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-win64
      # check/clippy do not link, so no xwin sysroot is needed here
      - run: cargo check -p s2sdk-sys -p s2sdk -p cs2-bridge -p cs2-native -p cs2-launcher --target x86_64-pc-windows-msvc
      - run: cargo clippy -p cs2-bridge -p cs2-native -p cs2-launcher --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  gen-check:
    name: gen.py --check (bindings match UPSTREAM.lock)
    # gen.py needs Python >= 3.11 (tomllib)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: clang 21 (apt.llvm.org)
        # gen.py parses clang's text dumps (record and vtable layouts, the JSON AST), whose format
        # moves between clang releases; the bindings are generated with clang 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21
          mkdir -p "$RUNNER_TEMP/clang-bin"
          ln -s /usr/bin/clang-21 "$RUNNER_TEMP/clang-bin/clang"
          ln -s /usr/bin/clang++-21 "$RUNNER_TEMP/clang-bin/clang++"
          echo "$RUNNER_TEMP/clang-bin" >> "$GITHUB_PATH"
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal -c rustfmt
          rustup default "$RUST_VERSION"
      - name: xwin sysroot cache
        id: xwin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xwin-sysroot
          key: xwin-${{ env.XWIN_VERSION }}-x86_64-v1
      - name: xwin sysroot (the MSVC pass; accepts Microsoft's license)
        env:
          XWIN_HIT: ${{ steps.xwin-cache.outputs.cache-hit }}
        run: |
          if [ "$XWIN_HIT" != true ]; then
            crates/s2sdk/s2sdk-sys/gen/fetch-xwin.sh
            rm -rf ~/xwin-sysroot && mv target/xwin ~/xwin-sysroot
          fi
          mkdir -p target && rm -rf target/xwin && ln -s ~/xwin-sysroot target/xwin
      - run: clang++ --version && python3 --version
      - run: python3 -I crates/s2sdk/s2sdk-sys/gen/gen.py --check

  sigs:
    name: sigcheck validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 sigs/scripts/sigcheck.py validate
