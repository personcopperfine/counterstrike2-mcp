# The cs2-mcp release: the launcher package for Windows (portable zip + per-user MSI) and Linux
# (tarball + AppImage + .deb), SHA256SUMS, the BUILDINFO files and a *draft* GitHub Release.
#
#   a tag push `v*`        builds everything and creates the draft release (RELEASING.md)
#   workflow_dispatch      dry run: builds everything, uploads the files as workflow artifacts,
#                          creates no release
#
# There are no game binaries on a runner, so the bridge is built with `cargo bridge build
# --no-pins-check`; that is written into every BUILDINFO.txt and the release notes. The pins are
# held to the game by the maintainer's local checks before tagging (RELEASING.md). The export
# gates still run here. Metamod:Source (both platforms) is AlliedModders' newest official dev
# build, recorded in BUILDINFO and the notes (crates/metamod/fetch-metamod.sh). The Windows Rust
# binaries are cross-built on Linux (xwin + rust-lld); windows-latest only runs WiX for the MSI.
# Nothing is code-signed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      metamod_linux_sha256:
        description: "Refuse the downloaded Metamod linux dev build unless it has this SHA-256 (empty: the MM_LINUX_SHA256 variable, else record whatever 'latest' is)"
        required: false
        default: ""
      metamod_win64_sha256:
        description: "Refuse the downloaded Metamod win64 dev build unless it has this SHA-256 (empty: the MM_WIN64_SHA256 variable, else record whatever 'latest' is)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.0"
  XWIN_VERSION: "0.10.0"
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_TERM_COLOR: always
  # .cargo/config.toml names lld-link; rustc's own lld (rustup ships it) is the same linker in
  # its link.exe flavour, so the runner needs no LLVM lld for the win64 link
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  build-linux:
    # 22.04: the Linux binaries need glibc <= 2.35 (the oldest base we can still build on)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            v="$GITHUB_REF_NAME"
          else
            v="v0.0.0-dryrun.$GITHUB_RUN_NUMBER"
          fi
          case "$v" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version $v is not vX.Y.Z[-...]"; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "cs2-mcp $v"

      - name: Free disk space (two Rust targets, the xwin sysroot)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: System packages
        # llvm: llvm-readobj/llvm-nm for the export gates; p7zip-full: gbe_fork's Windows release
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm p7zip-full
          llvm-readobj --version | head -n2

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_VERSION"
          rustc -vV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux

      - name: xwin sysroot cache
        id: xwin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xwin-sysroot
          key: xwin-${{ env.XWIN_VERSION }}-x86_64-v1

      - name: xwin sysroot (MSVC CRT + Windows SDK; accepts Microsoft's license)
        env:
          XWIN_HIT: ${{ steps.xwin-cache.outputs.cache-hit }}
        run: |
          # outside target/ so rust-cache's target cleanup never touches it; .cargo/config.toml
          # reads target/xwin, a symlink to it is what that file documents
          if [ "$XWIN_HIT" != true ]; then
            crates/s2sdk/s2sdk-sys/gen/fetch-xwin.sh
            rm -rf ~/xwin-sysroot && mv target/xwin ~/xwin-sysroot
          fi
          mkdir -p target && rm -rf target/xwin && ln -s ~/xwin-sysroot target/xwin
          ls target/xwin/crt/lib/x86_64 >/dev/null

      - name: Bridge + Metamod loader (both targets; export gates; pins gate skipped)
        run: cargo bridge build --no-pins-check

      - name: Metamod:Source linux + win64 (the official dev builds, recorded)
        env:
          # the dispatch inputs, else the repository variables (RELEASING.md); empty: the newest
          MM_LINUX_SHA256: ${{ inputs.metamod_linux_sha256 || vars.MM_LINUX_SHA256 }}
          MM_WIN64_SHA256: ${{ inputs.metamod_win64_sha256 || vars.MM_WIN64_SHA256 }}
        run: |
          crates/metamod/fetch-metamod.sh linux
          crates/metamod/fetch-metamod.sh win64

      - name: gbe_fork (release mode, pinned + hashed)
        env:
          GBE_LINUX_FROM: release
        run: crates/cs2-native/scripts/stage-gbe.sh

      - name: Packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          JOBS: "4"
        run: |
          crates/cs2-native/scripts/package.sh --os linux --archive
          crates/cs2-native/scripts/package.sh --os windows --archive
          mkdir -p target/dist/buildinfo
          cp target/cs2mcp-native-linux/BUILDINFO.txt target/dist/buildinfo/BUILDINFO-linux.txt
          cp target/cs2mcp-native-windows/BUILDINFO.txt target/dist/buildinfo/BUILDINFO-windows.txt
          ls -l target/dist
          cat target/dist/buildinfo/BUILDINFO-linux.txt target/dist/buildinfo/BUILDINFO-windows.txt

      # tar.gz/zip as built: upload-artifact drops exec bits of loose files, an archive keeps them
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: target/dist/cs2mcp-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: target/dist/cs2mcp-${{ steps.version.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildinfo
          path: target/dist/buildinfo/
          if-no-files-found: error

  package-windows:
    needs: build-linux
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build-linux.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-windows
          path: dl
      - name: Unpack the portable zip
        run: |
          python -I -m zipfile -e "dl/cs2mcp-$VERSION-windows-x86_64.zip" pkg
          ls "pkg/cs2mcp-$VERSION-windows-x86_64"
      - name: cargo-packager cache
        id: packager-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-${{ env.CARGO_PACKAGER_VERSION }}-windows
      - name: cargo-packager ${{ env.CARGO_PACKAGER_VERSION }}
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
      - name: MSI (per user, WiX 3 via cargo-packager)
        run: |
          python -I crates/cs2-launcher/packaging/packager.py --format wix \
            --package-dir "pkg/cs2mcp-$VERSION-windows-x86_64" --version "$VERSION" --out-dir out
          msi=(out/*.msi)
          [ "${#msi[@]}" = 1 ] && [ -f "${msi[0]}" ] || { echo "::error::expected one .msi in out/"; ls -l out; exit 1; }
          mkdir -p dist && mv "${msi[0]}" "dist/cs2mcp-$VERSION-windows-x86_64.msi"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: dist/
          if-no-files-found: error

  package-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build-linux.outputs.version }}
      # linuxdeploy and its plugins are AppImages; run them without FUSE
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-linux
          path: dl
      - name: Unpack the tarball
        run: |
          mkdir pkg && tar -C pkg -xzf "dl/cs2mcp-$VERSION-linux-x86_64.tar.gz"
          ls -l "pkg/cs2mcp-$VERSION-linux-x86_64"
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: cargo-packager cache
        id: packager-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-${{ env.CARGO_PACKAGER_VERSION }}-linux
      - name: cargo-packager ${{ env.CARGO_PACKAGER_VERSION }}
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
      - name: AppImage (verified against the package's SHA256SUMS) and .deb
        run: |
          pkg="pkg/cs2mcp-$VERSION-linux-x86_64"
          python3 -I crates/cs2-launcher/packaging/packager.py --format appimage --verify \
            --package-dir "$pkg" --version "$VERSION" --out-dir out-appimage
          python3 -I crates/cs2-launcher/packaging/packager.py --format deb \
            --package-dir "$pkg" --version "$VERSION" --out-dir out-deb
          mkdir -p dist
          one() { [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one file, got: $*" >&2; exit 1; }; }
          one out-appimage/*.AppImage && mv out-appimage/*.AppImage "dist/cs2mcp-$VERSION-linux-x86_64.AppImage"
          one out-deb/*.deb && mv out-deb/*.deb "dist/cs2mcp-$VERSION-linux-amd64.deb"
          chmod +x "dist/cs2mcp-$VERSION-linux-x86_64.AppImage"
          "dist/cs2mcp-$VERSION-linux-x86_64.AppImage" cs2mcp-native --help >/dev/null
          dpkg-deb --info "dist/cs2mcp-$VERSION-linux-amd64.deb"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-installers
          path: dist/
          if-no-files-found: error

  release:
    needs: [build-linux, package-windows, package-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-linux.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Assets, SHA256SUMS, release notes
        run: |
          mkdir -p assets
          for a in package-linux package-windows msi linux-installers buildinfo; do cp -v dl/$a/* assets/; done
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          python3 -I crates/cs2-launcher/packaging/release-notes.py --version "$VERSION" --dist assets \
            --buildinfo-windows assets/BUILDINFO-windows.txt --buildinfo-linux assets/BUILDINFO-linux.txt > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.VERSION }}
          path: |
            assets/
            notes.md
          if-no-files-found: error
      - name: Draft GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$VERSION" --draft --verify-tag "${pre[@]}" \
            --title "cs2-mcp $VERSION" --notes-file notes.md assets/*
